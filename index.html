:root{
  --bg:#050509;
  --surface:#0d0d16;
  --surface2:#14141f;
  --line:#29293a;
  --gold:#F2C94C;
  --teal:#80CBC4;
  --purple:#CE93D8;
  --text:#f4f1e8;
  --muted:#a9a7b8;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#050509;
    --surface:#0d0d16;
    --surface2:#14141f;
    --line:#29293a;
    --text:#f4f1e8;
    --muted:#a9a7b8;
  }
}

*{
  box-sizing:border-box;
}

html,body,#root{
  margin:0;
  min-width:0;
  background:var(--bg);
  color:var(--text);
}

body{
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:clip;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.shell{
  min-height:100vh;
  width:100%;
  background:radial-gradient(circle at 50% 0, rgba(242,201,76,.09), transparent 34%), var(--bg);
}

.sans{
  font-family:Arial,Helvetica,sans-serif;
}

.mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}

.card{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:18px;
}

.kicker{
  font-family:Arial,Helvetica,sans-serif;
  text-transform:uppercase;
  letter-spacing:.16em;
  font-size:11px;
  font-weight:800;
  color:var(--teal);
}

.tile{
  border:1px solid #3a3a4c;
  background:#171724;
  border-radius:12px;
  padding:11px;
  text-align:left;
  transition:.15s;
}

.tile:hover{
  transform:translateY(-2px);
  border-color:var(--teal);
}

.tile.active{
  border-color:var(--gold);
  background:#211d11;
  box-shadow:0 0 0 2px rgba(242,201,76,.16);
}

.tile.geo{
  border-color:var(--gold);
  background:linear-gradient(145deg,#2b2310,#15151f);
}

.gapcell{
  border:1px dashed #3d3d50;
  border-radius:12px;
  padding:11px;
  text-align:left;
  color:#77768b;
  background:transparent;
}

.gapcell:hover{
  border-color:var(--purple);
  color:var(--purple);
}

.scanning{
  animation:scan 2.2s ease-in-out infinite;
}

@keyframes scan{
  0%,100%{
    opacity:.55
  }

  50%{
    opacity:1;
    background:rgba(206,147,216,.09);
    border-color:var(--purple)
  }
}

.pulse{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--teal);
  margin-right:7px;
  animation:pulse 1.8s infinite;
}

@keyframes pulse{
  50%{
    opacity:.25;
    transform:scale(.7)
  }
}

.motor-ring{
  animation:motorSpin 3.2s linear infinite;
  transform-origin:center;
}

.motor-ring-slow{
  animation:motorSpin 7s linear infinite;
  transform-origin:center;
}

.motor-paused .motor-ring, .motor-paused .motor-ring-slow{
  animation-play-state:paused;
}

@keyframes motorSpin{
  to{
    transform:rotate(360deg);
  }
}

.vulkan-glow{
  box-shadow:0 0 0 2px rgba(242,201,76,.25), 0 0 42px rgba(242,201,76,.28);
}

.vulkan-dim{
  opacity:.55;
}

.range{
  width:100%;
  accent-color:var(--gold);
}

.pillar{
  border:1px solid var(--line);
  background:var(--surface2);
  border-radius:13px;
  padding:14px;
  text-align:left;
  min-height:168px;
  display:flex;
  flex-direction:column;
}

.pillar.active{
  border-color:var(--c);
  box-shadow:inset 0 -5px 0 var(--c);
}

.chip{
  font-family:Arial,sans-serif;
  font-size:12px;
  color:var(--muted);
  background:var(--surface2);
  border:1px solid var(--line);
  padding:7px 9px;
  border-radius:999px;
}

.btn-gold{
  background:var(--gold);
  color:#111;
  border:1px solid var(--gold);
  border-radius:999px;
  padding:9px 13px;
  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:800;
}

.btn-ghost{
  background:var(--surface2);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:999px;
  padding:9px 12px;
  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:800;
}

.btn-ghost:disabled, .btn-gold:disabled{
  opacity:.35;
}

input[type="range"]{
  cursor:pointer;
}

@media (min-width: 640px) {
  .sm\:grid-cols-4 {
